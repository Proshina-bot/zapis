<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шиномонтаж PRO-шина · Рабочая версия</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #dbe7ec; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 40px; padding: 25px; }
        h1 { margin-bottom: 20px; color: #0b313b; }
        .top-bar { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        .date-picker-bar { background: #f2f9ff; padding: 10px 20px; border-radius: 50px; display: flex; gap: 10px; align-items: center; }
        #datePicker { padding: 8px 16px; border-radius: 40px; border: 1px solid #b0d0dc; font-size: 1rem; }
        .branch-selector { display: flex; gap: 10px; background: #f2f9ff; padding: 5px; border-radius: 50px; }
        .branch-btn { padding: 8px 20px; border-radius: 40px; border: none; cursor: pointer; background: transparent; }
        .branch-btn.active { background: #1b6c7c; color: white; }
        .open-journal-btn { background: #1b6c7c; color: white; border: none; padding: 10px 25px; border-radius: 50px; cursor: pointer; }
        .main-grid { display: grid; grid-template-columns: 2fr 1.2fr; gap: 25px; }
        @media (max-width: 1000px) { .main-grid { grid-template-columns: 1fr; } }
        .slots-panel { background: #f6fbfe; border-radius: 30px; padding: 20px; }
        .time-slot-row { display: flex; margin-bottom: 8px; background: white; border-radius: 16px; border: 1px solid #c0dae7; overflow: hidden; min-height: 65px; }
        .time-label { min-width: 85px; background: #cde5f0; display: flex; align-items: center; justify-content: center; font-weight: 700; border-right: 2px dashed #8fb9ca; }
        .cars-row { display: flex; flex: 1; }
        .car-slot { flex: 1; padding: 8px; text-align: center; border-right: 1px solid #c9dee9; cursor: pointer; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .car-slot.free:hover { background: #ffebd2; }
        .car-slot.occupied { background: #e0edf3; cursor: pointer; }
        .slot-brand { font-size: 0.8rem; font-weight: 800; background: #fec89c; padding: 3px 6px; border-radius: 20px; }
        .slot-empty { font-size: 0.85rem; font-weight: 700; color: #7b9eab; }
        .entry-panel { background: #f2f8fc; border-radius: 30px; padding: 20px; }
        .selected-box { background: #deedf5; border-radius: 20px; padding: 15px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { font-weight: 700; color: #12505e; display: block; margin-bottom: 5px; }
        .form-control { width: 100%; padding: 12px 16px; border: 2px solid #bed3e0; border-radius: 40px; font-size: 0.95rem; }
        .service-btns { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
        .service-btn { background: white; border: 2px solid #bed3e0; padding: 8px 15px; border-radius: 40px; cursor: pointer; }
        .service-btn.selected { background: #ffcf9c; border-color: #ed8026; font-weight: 700; }
        .size-selector { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .size-btn { background: white; border: 2px solid #bed3e0; padding: 6px 12px; border-radius: 40px; cursor: pointer; }
        .size-btn.selected { background: #ffcf9c; border-color: #ed8026; }
        .primary-btn { background: #f6842a; color: white; font-weight: 800; font-size: 1.2rem; padding: 15px; width: 100%; border-radius: 60px; border: none; cursor: pointer; margin-top: 15px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal.show { display: flex; }
        .modal-content { background: white; width: 90%; max-width: 500px; border-radius: 30px; padding: 25px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .close-modal { font-size: 2rem; cursor: pointer; background: none; border: none; }
        .journal-cards { max-height: 500px; overflow-y: auto; }
        .record-card { background: white; border: 1px solid #ddd; border-radius: 20px; padding: 15px; margin-bottom: 10px; }
        .card-actions { display: flex; gap: 10px; margin-top: 10px; }
        .goto-btn, .move-date-btn, .delete-btn { flex: 1; padding: 8px; border-radius: 30px; cursor: pointer; border: none; }
        .goto-btn { background: #1b6c7c; color: white; }
        .move-date-btn { background: #fec89c; }
        .delete-btn { background: #ffd9d9; color: #b13e3e; }
    </style>
</head>
<body>
<div class="container">
    <h1>🧰 Шиномонтаж PRO-шина</h1>
    
    <div class="top-bar">
        <div class="date-picker-bar">
            <span>🗓 Дата:</span>
            <input type="text" id="datePicker" placeholder="Выберите дату" readonly>
        </div>
        <div class="branch-selector" id="branchSelector">
            <button class="branch-btn active" data-branch="ryabinina">🏠 Рябинина</button>
            <button class="branch-btn" data-branch="amundsena">🏭 Амундсена</button>
        </div>
        <button class="open-journal-btn" id="openJournalBtn">📋 Журнал записей</button>
    </div>

    <div class="main-grid">
        <div class="slots-panel">
            <div id="timeSlotsContainer"></div>
            <div style="margin-top: 15px;">
                <span>🟢 ПУСТО — свободно</span>
                <span style="margin-left: 20px;">🟠 ЗАНЯТО — с маркой авто</span>
            </div>
        </div>

        <div class="entry-panel">
            <h3>📝 Новая запись</h3>
            <div class="selected-box">
                <div>⏰ Время: <strong id="selectedTimeDisplay">—</strong></div>
                <div>📅 Дата: <strong id="selectedDateDisplay">—</strong></div>
                <div>🏢 Филиал: <strong id="selectedBranchDisplay">Рябинина</strong></div>
            </div>

            <div class="form-group">
                <label>🔧 Услуги:</label>
                <div class="service-btns" id="serviceButtons">
                    <button class="service-btn" data-service="Комплекс">Комплекс</button>
                    <button class="service-btn" data-service="СУ+Баланс">СУ+Баланс</button>
                    <button class="service-btn" data-service="Ремонт">Ремонт</button>
                    <button class="service-btn" data-service="Правка">Правка</button>
                    <button class="service-btn special" data-service="Слесарка" data-special="true">Слесарка</button>
                    <button class="service-btn special" data-service="Кондиционер" data-special="true">Кондиционер</button>
                </div>
                <div id="selectedServicesDisplay">✓ Выбрано: —</div>
            </div>

            <div class="form-group">
                <label>📏 Размер колёс:</label>
                <div class="size-selector" id="sizeSelector">
                    <span class="size-btn" data-size="R13">R13</span>
                    <span class="size-btn" data-size="R14">R14</span>
                    <span class="size-btn" data-size="R15">R15</span>
                    <span class="size-btn" data-size="R16">R16</span>
                    <span class="size-btn" data-size="R17">R17</span>
                    <span class="size-btn" data-size="R18">R18</span>
                    <span class="size-btn" data-size="R19">R19</span>
                    <span class="size-btn" data-size="R20">R20</span>
                    <span class="size-btn" data-size="R21">R21</span>
                    <span class="size-btn" data-size="R22">R22</span>
                </div>
            </div>

            <div class="form-group">
                <label>🚗 Марка автомобиля</label>
                <input type="text" id="carBrand" class="form-control" placeholder="Toyota, BMW...">
            </div>

            <div class="form-group">
                <label>👤 Имя клиента</label>
                <input type="text" id="clientName" class="form-control" placeholder="Имя">
            </div>

            <div class="form-group">
                <label>📞 Телефон</label>
                <input type="tel" id="phoneNumber" class="form-control" placeholder="+7 (___) ___-__-__">
            </div>

            <div class="form-group">
                <label>📱 Способ уведомления:</label>
                <div style="display: flex; gap: 20px; margin-top: 8px;">
                    <label><input type="radio" name="notificationMethod" value="whatsapp" checked> WhatsApp</label>
                    <label><input type="radio" name="notificationMethod" value="sms"> SMS</label>
                </div>
            </div>

            <div class="form-group">
                <label>💬 Комментарий</label>
                <textarea id="comment" class="form-control" rows="2" placeholder="..."></textarea>
            </div>

            <button class="primary-btn" id="bookSlotBtn">✚ ЗАПИСАТЬ</button>
            <div id="liveStatus" style="background:#dcf5e3; border-radius:40px; padding:10px; margin-top:12px; display:none;"></div>
        </div>
    </div>
</div>

<div class="modal" id="journalModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>📋 Журнал записей</h2>
            <button class="close-modal" id="closeJournalBtn">&times;</button>
        </div>
        <div class="journal-filter">
            <input type="text" id="journalSearch" placeholder="Фильтр..." style="width:100%; padding:10px; margin-bottom:15px;">
        </div>
        <div id="journalCards" class="journal-cards"></div>
        <div style="margin-top:10px;" id="journalCount"></div>
    </div>
</div>

<div class="modal" id="moveDateModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>📅 Выберите новую дату</h2>
            <button class="close-modal" id="closeMoveDateBtn">&times;</button>
        </div>
        <input type="text" id="moveDatePicker" style="width:100%; padding:12px; margin:15px 0;">
        <p>После выбора даты, выберите свободный слот</p>
        <button class="delete-btn" id="cancelMoveDateBtn" style="width:100%;">Отмена</button>
    </div>
</div>

<div class="modal" id="detailModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>📌 Детали записи</h2>
            <button class="close-modal" id="closeDetailBtn">&times;</button>
        </div>
        <div id="detailInfo"></div>
        <div style="margin-top:15px;">
            <label>📝 Дополнительный комментарий:</label>
            <textarea id="extraCommentField" rows="2" style="width:100%; margin:10px 0;"></textarea>
            <button class="delete-btn" id="saveExtraCommentBtn" style="background:#1b6c7c; color:white;">💾 Сохранить комментарий</button>
        </div>
        <button class="delete-btn" id="deleteFromDetailBtn" style="margin-top:10px;">✖ Удалить запись</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ru.js"></script>
<script>
    flatpickr.localize(flatpickr.l10ns.ru);
    
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby8c3q7iu0FPf2R0u4OFETkLgvgUJMPMhNk08lBPlpQd-_-2VwBEbWYk5LgtVUNKR6l/exec';
    
    // Глобальные переменные
    let occupiedSlots = {};
    let currentSelection = { date: null, time: null, slotKey: null };
    let selectedServices = [];
    let selectedSize = '';
    let currentBranch = 'ryabinina';
    let moveSourceKey = null;
    let currentDetailSlotKey = null;
    
    // DOM элементы
    const datePicker = document.getElementById('datePicker');
    const slotsContainer = document.getElementById('timeSlotsContainer');
    const selectedTimeSpan = document.getElementById('selectedTimeDisplay');
    const selectedDateSpan = document.getElementById('selectedDateDisplay');
    const selectedBranchSpan = document.getElementById('selectedBranchDisplay');
    const bookBtn = document.getElementById('bookSlotBtn');
    const statusDiv = document.getElementById('liveStatus');
    const serviceBtns = document.querySelectorAll('.service-btn');
    const selectedServicesDisplay = document.getElementById('selectedServicesDisplay');
    const sizeBtns = document.querySelectorAll('.size-btn');
    const branchBtns = document.querySelectorAll('.branch-btn');
    const carBrandInput = document.getElementById('carBrand');
    const clientNameInput = document.getElementById('clientName');
    const phoneInput = document.getElementById('phoneNumber');
    const commentInput = document.getElementById('comment');
    
    // Модалки
    const journalModal = document.getElementById('journalModal');
    const openJournalBtn = document.getElementById('openJournalBtn');
    const closeJournalBtn = document.getElementById('closeJournalBtn');
    const journalCardsDiv = document.getElementById('journalCards');
    const journalSearch = document.getElementById('journalSearch');
    const journalCount = document.getElementById('journalCount');
    const moveDateModal = document.getElementById('moveDateModal');
    const closeMoveDateBtn = document.getElementById('closeMoveDateBtn');
    const cancelMoveDateBtn = document.getElementById('cancelMoveDateBtn');
    const moveDatePicker = document.getElementById('moveDatePicker');
    const detailModal = document.getElementById('detailModal');
    const closeDetailBtn = document.getElementById('closeDetailBtn');
    const detailInfoDiv = document.getElementById('detailInfo');
    const deleteFromDetailBtn = document.getElementById('deleteFromDetailBtn');
    const extraCommentField = document.getElementById('extraCommentField');
    const saveExtraCommentBtn = document.getElementById('saveExtraCommentBtn');
    
    const CARS = ['1', '2', '3'];
    let isUpdating = false;
    
    // Форматирование
    function formatPhone(value) {
        const digits = value.replace(/\D/g, '');
        let result = '+7';
        if (digits.length > 1) result += ' (' + digits.substring(1, 4);
        if (digits.length >= 5) result += ') ' + digits.substring(4, 7);
        if (digits.length >= 8) result += '-' + digits.substring(7, 9);
        if (digits.length >= 10) result += '-' + digits.substring(9, 11);
        return result;
    }
    
    phoneInput.addEventListener('input', function(e) {
        let val = e.target.value;
        if (!val.startsWith('+7')) val = '+7' + val.replace(/^\+?7?/, '');
        e.target.value = formatPhone(val);
    });
    
    function capitalizeName(name) {
        if (!name) return name;
        return name.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
    }
    
    clientNameInput.addEventListener('blur', function() { this.value = capitalizeName(this.value); });
    carBrandInput.addEventListener('input', function() { this.value = this.value.toUpperCase(); });
    
    function getTimeSlotsForDate(date) {
        if (!date) return [];
        const d = new Date(date);
        const isWeekend = d.getDay() === 0 || d.getDay() === 6;
        let startHour = isWeekend ? 10 : 9;
        let endHour = isWeekend ? 20 : 21;
        const slots = [];
        for (let hour = startHour; hour < endHour; hour++) {
            if (hour === 14) slots.push(`${hour.toString().padStart(2,'0')}:30`);
            else { slots.push(`${hour.toString().padStart(2,'0')}:00`); slots.push(`${hour.toString().padStart(2,'0')}:30`); }
        }
        return slots;
    }
    
    function updateServicesDisplay() {
        selectedServicesDisplay.textContent = selectedServices.length ? '✓ Выбрано: ' + selectedServices.join(', ') : '✓ Выбрано: —';
    }
    
    function clearSelection() {
        currentSelection = { date: null, time: null, slotKey: null };
        selectedTimeSpan.textContent = '—';
        selectedDateSpan.textContent = '—';
        document.querySelectorAll('.car-slot.free').forEach(s => s.classList.remove('selected-slot'));
    }
    
    function exitMoveMode() {
        moveSourceKey = null;
        document.body.classList.remove('move-mode');
    }
    
    function showStatus(msg, type) {
        statusDiv.style.display = 'block';
        statusDiv.textContent = msg;
        statusDiv.style.background = type === 'error' ? '#ffd9d9' : '#dcf5e3';
        setTimeout(() => statusDiv.style.display = 'none', 3000);
    }
    
    // Обработчики
    serviceBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            const service = this.dataset.service;
            const idx = selectedServices.indexOf(service);
            idx === -1 ? selectedServices.push(service) : selectedServices.splice(idx, 1);
            this.classList.toggle('selected');
            updateServicesDisplay();
        });
    });
    
    sizeBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            sizeBtns.forEach(b => b.classList.remove('selected'));
            this.classList.add('selected');
            selectedSize = this.dataset.size;
        });
    });
    
    branchBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            branchBtns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentBranch = this.dataset.branch;
            selectedBranchSpan.textContent = currentBranch === 'ryabinina' ? 'Рябинина' : 'Амундсена';
            serviceBtns.forEach(btn => {
                if (btn.dataset.special === 'true') {
                    btn.style.display = currentBranch === 'amundsena' ? 'inline-block' : 'none';
                }
            });
            selectedServices = [];
            serviceBtns.forEach(b => b.classList.remove('selected'));
            updateServicesDisplay();
            if (datePicker.value) loadOccupiedFromServer();
            clearSelection();
        });
    });
    
    serviceBtns.forEach(btn => { if (btn.dataset.special === 'true') btn.style.display = 'none'; });
    
    flatpickr(datePicker, {
        dateFormat: "Y-m-d",
        defaultDate: new Date(),
        locale: 'ru',
        onChange: function(_, dateStr) { loadOccupiedFromServer(); clearSelection(); }
    });
    
    flatpickr(moveDatePicker, {
        dateFormat: "Y-m-d",
        locale: 'ru',
        minDate: "today",
        onChange: function(_, dateStr) {
            if (moveSourceKey && dateStr) {
                moveDateModal.classList.remove('show');
                datePicker.value = dateStr;
                renderSlotsForDate(dateStr);
                document.body.classList.add('move-mode');
                showStatus(`🔁 Выберите свободный слот на ${dateStr}`, 'info');
            }
        }
    });
    
    async function loadOccupiedFromServer() {
        if (isUpdating) return;
        try {
            isUpdating = true;
            const response = await fetch(APPS_SCRIPT_URL + '?_=' + Date.now());
            const data = await response.json();
            occupiedSlots = (data && typeof data === 'object') ? data : {};
            if (datePicker.value) renderSlotsForDate(datePicker.value);
            renderJournal();
        } catch(e) { console.error(e); }
        finally { isUpdating = false; }
    }
    
    async function sendToServer(action, data) {
        try {
            isUpdating = true;
            showStatus('⏳ Отправка...', 'info');
            const params = new URLSearchParams({ action, ...data, _: Date.now() });
            const url = APPS_SCRIPT_URL + '?' + params.toString();
            const response = await fetch(url);
            const result = await response.json();
            if (result && typeof result === 'object' && !result.error) {
                occupiedSlots = result;
                showStatus('✅ Данные сохранены', 'success');
            }
            if (datePicker.value) renderSlotsForDate(datePicker.value);
            renderJournal();
        } catch(e) { console.error(e); showStatus('❌ Ошибка', 'error'); }
        finally { isUpdating = false; }
    }
    
    function renderSlotsForDate(dateStr) {
        if (!dateStr) return;
        const currentSlotKey = currentSelection.slotKey;
        slotsContainer.innerHTML = '';
        const timeSlots = getTimeSlotsForDate(dateStr);
        let freeCount = 0;
        
        timeSlots.forEach(time => {
            const isLunch = time === '14:00';
            const row = document.createElement('div'); row.className = 'time-slot-row';
            const timeLabel = document.createElement('div'); timeLabel.className = 'time-label';
            timeLabel.innerHTML = isLunch ? `${time}<br><small>Обед</small>` : time;
            row.appendChild(timeLabel);
            const carsDiv = document.createElement('div'); carsDiv.className = 'cars-row';
            
            if (isLunch) {
                for (let i = 0; i < CARS.length; i++) {
                    const empty = document.createElement('div'); empty.className = 'car-slot occupied';
                    empty.style.background = '#ffcf9c';
                    empty.innerHTML = '🚫 Обед';
                    carsDiv.appendChild(empty);
                }
            } else {
                CARS.forEach((car, idx) => {
                    const slotKey = `${currentBranch}_${dateStr}_${time}_${car}`;
                    const occ = occupiedSlots[slotKey];
                    const slotDiv = document.createElement('div');
                    slotDiv.className = `car-slot ${occ ? 'occupied' : 'free'}`;
                    slotDiv.dataset.time = time;
                    slotDiv.dataset.car = car;
                    slotDiv.dataset.slotKey = slotKey;
                    
                    if (occ) {
                        slotDiv.innerHTML = `<div class="slot-brand">${occ.carBrand || '???'}</div>`;
                        slotDiv.addEventListener('click', () => {
                            if (document.body.classList.contains('move-mode')) { showStatus('Нельзя выбрать занятый слот', 'error'); return; }
                            currentDetailSlotKey = slotKey;
                            const data = occupiedSlots[slotKey];
                            detailInfoDiv.innerHTML = `
                                <div><strong>Филиал:</strong> ${data.branch === 'ryabinina' ? 'Рябинина' : 'Амундсена'}</div>
                                <div><strong>Дата:</strong> ${dateStr}</div>
                                <div><strong>Время:</strong> ${time}</div>
                                <div><strong>Услуги:</strong> ${data.services ? data.services.join(', ') : ''} ${data.size || ''}</div>
                                <div><strong>Марка:</strong> ${data.carBrand || '—'}</div>
                                <div><strong>Имя:</strong> ${data.clientName || '—'}</div>
                                <div><strong>Телефон:</strong> ${data.phone || '—'}</div>
                                <div><strong>Коммент:</strong> ${data.comment || '—'}</div>
                                <div><strong>Уведомление:</strong> ${data.notificationMethod === 'whatsapp' ? 'WhatsApp' : 'SMS'}</div>
                            `;
                            extraCommentField.value = data.extraComment || '';
                            detailModal.classList.add('show');
                        });
                    } else {
                        freeCount++;
                        slotDiv.innerHTML = `<div class="slot-empty">ПУСТО</div>`;
                        slotDiv.addEventListener('click', async (e) => {
                            e.stopPropagation();
                            if (document.body.classList.contains('move-mode') && moveSourceKey) {
                                if (occupiedSlots[moveSourceKey]) {
                                    const sourceData = occupiedSlots[moveSourceKey];
                                    await sendToServer('move', {
                                        oldSlotKey: moveSourceKey, newSlotKey: slotKey,
                                        newBranch: currentBranch, newDate: dateStr, newTime: time, newCar: car,
                                        services: sourceData.services ? sourceData.services.join(',') : '',
                                        size: sourceData.size || '', carBrand: sourceData.carBrand || '',
                                        clientName: sourceData.clientName || '', phone: sourceData.phone || '',
                                        comment: sourceData.comment || '', extraComment: sourceData.extraComment || '',
                                        notificationMethod: sourceData.notificationMethod || 'whatsapp'
                                    });
                                    occupiedSlots[slotKey] = { ...sourceData, branch: currentBranch };
                                    delete occupiedSlots[moveSourceKey];
                                    renderSlotsForDate(dateStr);
                                    exitMoveMode();
                                }
                                return;
                            }
                            document.querySelectorAll('.car-slot.free').forEach(s => s.classList.remove('selected-slot'));
                            slotDiv.classList.add('selected-slot');
                            currentSelection = { date: dateStr, time, slotKey };
                            selectedTimeSpan.textContent = time;
                            selectedDateSpan.textContent = dateStr;
                        });
                    }
                    carsDiv.appendChild(slotDiv);
                });
            }
            row.appendChild(carsDiv);
            slotsContainer.appendChild(row);
        });
        document.getElementById('freeSlotsCount').innerHTML = `🟢 ${freeCount} свободно`;
        if (currentSlotKey) {
            const slotEl = document.querySelector(`[data-slot-key="${currentSlotKey}"]`);
            if (slotEl && slotEl.classList.contains('free')) slotEl.classList.add('selected-slot');
        }
    }
    
    function renderJournal() {
        const search = journalSearch.value.toLowerCase() || '';
        const entries = Object.entries(occupiedSlots).map(([k,v]) => {
            const [branch, date, time, car] = k.split('_');
            return { key: k, branch, date, time, car, ...v };
        }).filter(e => (e.clientName && e.clientName.toLowerCase().includes(search)) || (e.carBrand && e.carBrand.toLowerCase().includes(search)) || (e.phone && e.phone.includes(search)) || search === '')
         .sort((a,b) => (a.date + a.time).localeCompare(b.date + b.time));
        
        journalCardsDiv.innerHTML = entries.length ? '' : '<div style="padding:40px; text-align:center;">✖️ Нет записей</div>';
        entries.forEach(e => {
            const card = document.createElement('div'); card.className = 'record-card';
            card.innerHTML = `
                <div><strong>🏢 ${e.branch === 'ryabinina' ? 'Рябинина' : 'Амундсена'} | 📅 ${e.date} ⏰ ${e.time}</strong></div>
                <div>🔧 ${e.services ? e.services.join(', ') : ''} ${e.size || ''}</div>
                <div>👤 ${e.clientName || '—'}</div><div>🚗 ${e.carBrand || '—'}</div><div>📞 ${e.phone || '—'}</div>
                <div>📱 Уведомление: ${e.notificationMethod === 'whatsapp' ? 'WhatsApp' : 'SMS'}</div>
                <div class="card-actions">
                    <button class="goto-btn" data-slotkey="${e.key}">🔍 Перейти</button>
                    <button class="move-date-btn" data-slotkey="${e.key}">📅 Перенести</button>
                    <button class="delete-btn" data-slotkey="${e.key}">✖ Удалить</button>
                </div>
            `;
            card.querySelector('.goto-btn').addEventListener('click', (ev) => {
                const key = ev.target.dataset.slotkey;
                const [branch, date, time, car] = key.split('_');
                document.querySelector(`.branch-btn[data-branch="${branch}"]`).click();
                datePicker.value = date;
                loadOccupiedFromServer();
                journalModal.classList.remove('show');
            });
            card.querySelector('.move-date-btn').addEventListener('click', (ev) => {
                moveSourceKey = ev.target.dataset.slotkey;
                journalModal.classList.remove('show');
                moveDateModal.classList.add('show');
            });
            card.querySelector('.delete-btn').addEventListener('click', async (ev) => {
                const key = ev.target.dataset.slotkey;
                if (confirm('Удалить запись?')) {
                    await sendToServer('delete', { slotKey: key });
                    delete occupiedSlots[key];
                    renderSlotsForDate(datePicker.value);
                    renderJournal();
                }
            });
            journalCardsDiv.appendChild(card);
        });
        journalCount.textContent = `Всего: ${entries.length}`;
    }
    
    bookBtn.addEventListener('click', async () => {
        const date = datePicker.value;
        if (!date) return showStatus('❌ Выберите дату', 'error');
        if (!currentSelection.time) return showStatus('❌ Выберите свободный слот', 'error');
        if (selectedServices.length === 0) return showStatus('❌ Выберите услугу', 'error');
        if (!selectedSize) return showStatus('❌ Выберите размер колёс', 'error');
        const carBrand = carBrandInput.value.trim();
        if (!carBrand) return showStatus('❌ Марка обязательна', 'error');
        
        const slotKey = currentSelection.slotKey;
        if (occupiedSlots[slotKey]) return showStatus('❌ Слот занят', 'error');
        
        const clientName = capitalizeName(clientNameInput.value.trim());
        const notificationMethod = document.querySelector('input[name="notificationMethod"]:checked').value;
        
        occupiedSlots[slotKey] = {
            services: [...selectedServices], size: selectedSize, carBrand, clientName,
            phone: phoneInput.value.trim(), comment: commentInput.value.trim(), extraComment: '',
            branch: currentBranch, notificationMethod
        };
        renderSlotsForDate(date);
        
        await sendToServer('new', {
            branch: currentBranch, date, time: currentSelection.time, car: '1',
            services: selectedServices.join(','), size: selectedSize, carBrand, clientName,
            phone: phoneInput.value.trim(), comment: commentInput.value.trim(), notificationMethod
        });
        
        carBrandInput.value = ''; clientNameInput.value = ''; phoneInput.value = ''; commentInput.value = '';
        serviceBtns.forEach(b => b.classList.remove('selected')); sizeBtns.forEach(b => b.classList.remove('selected'));
        selectedServices = []; updateServicesDisplay(); selectedSize = ''; clearSelection();
    });
    
    saveExtraCommentBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!currentDetailSlotKey) { showStatus('❌ Нет выбранной записи', 'error'); return; }
        const comment = extraCommentField.value.trim();
        if (!comment) { showStatus('❌ Комментарий пуст', 'error'); return; }
        await sendToServer('saveExtraComment', { slotKey: currentDetailSlotKey, extraComment: comment });
        if (occupiedSlots[currentDetailSlotKey]) occupiedSlots[currentDetailSlotKey].extraComment = comment;
        detailModal.classList.remove('show');
        showStatus('✅ Комментарий сохранён', 'success');
    });
    
    deleteFromDetailBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (currentDetailSlotKey && confirm('Удалить эту запись?')) {
            await sendToServer('delete', { slotKey: currentDetailSlotKey });
            delete occupiedSlots[currentDetailSlotKey];
            detailModal.classList.remove('show');
            renderSlotsForDate(datePicker.value);
            renderJournal();
        }
    });
    
    openJournalBtn.addEventListener('click', () => { renderJournal(); journalModal.classList.add('show'); exitMoveMode(); });
    closeJournalBtn.addEventListener('click', () => journalModal.classList.remove('show'));
    closeMoveDateBtn.addEventListener('click', () => moveDateModal.classList.remove('show'));
    cancelMoveDateBtn.addEventListener('click', () => moveDateModal.classList.remove('show'));
    closeDetailBtn.addEventListener('click', () => detailModal.classList.remove('show'));
    window.addEventListener('click', (e) => { if (e.target === journalModal) journalModal.classList.remove('show'); if (e.target === moveDateModal) moveDateModal.classList.remove('show'); if (e.target === detailModal) detailModal.classList.remove('show'); });
    journalSearch.addEventListener('input', renderJournal);
    setInterval(() => { if (!isUpdating && !document.body.classList.contains('move-mode') && !journalModal.classList.contains('show') && !moveDateModal.classList.contains('show')) loadOccupiedFromServer(); }, 5000);
    
    loadOccupiedFromServer();
    selectedBranchSpan.textContent = 'Рябинина';
</script>
</body>
</html>
